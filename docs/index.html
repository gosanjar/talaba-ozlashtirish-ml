<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talaba Monitoring Tizimi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f6fa; --surface:#fff; --surface-2:#f0f2f7; --border:#e1e5ee; --text:#1a1f33; --muted:#667089;
  --accent:#3b5bfd; --accent-soft:#e7ecff;
  --good:#16956a; --good-soft:#e1f5ec; --warn:#d48400; --warn-soft:#fff2d9; --bad:#d63447; --bad-soft:#fde6e9;
  --info:#2f7de1; --info-soft:#e3effd; --purple:#8352d6; --purple-soft:#f0e8fd; --gray:#7d8599; --gray-soft:#eef0f4;
  --shadow:0 1px 2px rgba(20,25,50,.05),0 4px 14px rgba(20,25,50,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#161a2c; --surface-2:#1d2237; --border:#2a3050; --text:#e6e8f2; --muted:#9aa1bc;
  --accent:#7c8eff; --accent-soft:#232a52;
  --good:#3ccf90; --good-soft:#15332a; --warn:#f2b441; --warn-soft:#3a2e12; --bad:#ff6b7b; --bad-soft:#3d1a22;
  --info:#6aa8ff; --info-soft:#17284a; --purple:#b48cf3; --purple-soft:#2c2045; --gray:#8e96ae; --gray-soft:#252a3e; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2c; --surface-2:#1d2237; --border:#2a3050; --text:#e6e8f2; --muted:#9aa1bc;
  --accent:#7c8eff; --accent-soft:#232a52;
  --good:#3ccf90; --good-soft:#15332a; --warn:#f2b441; --warn-soft:#3a2e12; --bad:#ff6b7b; --bad-soft:#3d1a22;
  --info:#6aa8ff; --info-soft:#17284a; --purple:#b48cf3; --purple-soft:#2c2045; --gray:#8e96ae; --gray-soft:#252a3e; --shadow:none}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.hwrap{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;height:58px}
.logo{font-weight:700;font-size:15.5px;white-space:nowrap}
.logo span{color:var(--muted);font-weight:400}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--text)}
nav a.active{background:var(--accent-soft);color:var(--accent)}
.iconbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
#banner{display:none;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
main{max-width:1360px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 12px} h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .l{color:var(--muted);font-size:12.5px} .kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{color:var(--muted);font-size:12px}
.chart{position:relative;height:260px} .chart.tall{height:340px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.gchip{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;border-radius:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--surface);z-index:1}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--text)}
th.num,td.num{text-align:right}
td.wrap{white-space:normal}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
tr.base td{color:var(--muted);font-style:italic} tr.best td{font-weight:700}
.tablewrap{overflow:auto;max-height:560px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;width:100%}
.filters input{max-width:240px} .filters select{width:auto;max-width:220px}
input[type=range]{padding:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:8px 15px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:50px} .bar i{display:block;height:100%;border-radius:5px}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;min-width:120px;background:var(--surface-2)} .stack i{display:block;height:100%}
.pb{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13.5px} .kv span{color:var(--muted)} .kv b{text-align:right}
.factor{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border)}
.dv{display:flex} .dv .h{width:50%;display:flex} .dv .h.l{justify-content:flex-end;border-right:1px solid var(--border)}
.dv i{display:block;height:10px;border-radius:3px}
.adv{display:flex;flex-direction:column;gap:8px}
.adv div{padding:8px 12px;border-radius:8px;font-size:13.5px;border-left:3px solid}
.sim{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.sim:hover{background:var(--surface-2)}
fieldset{border:1px solid var(--border);border-radius:10px;padding:12px 14px 6px;margin:0 0 14px;min-width:0}
legend{font-weight:600;font-size:13px;color:var(--muted);padding:0 6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:4px 14px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px} label input,label select{margin-top:4px}
.subjrow{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 78px 120px;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border)}
.subjrow input{padding:6px 8px}
.err{color:var(--bad);margin-top:10px;font-weight:600}
.sticky{position:sticky;top:76px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;display:none;max-width:90vw}
.loading{color:var(--muted);padding:40px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700;padding:0}
.note{background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--muted)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13.5px;margin-bottom:6px}
.crumbs a{text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:6px}
.heat td{text-align:center;font-size:12px;padding:6px 4px;min-width:44px}
.heat th{font-size:11px;white-space:normal;min-width:44px;position:static}
.modal{position:fixed;inset:0;background:rgba(10,12,25,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.tz{display:grid;grid-template-columns:70px 70px 1fr 70px 30px;gap:6px;align-items:center;margin-bottom:6px}
.pred-card .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.wif{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.delta-up{color:var(--good);font-weight:700} .delta-dn{color:var(--bad);font-weight:700}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g2{grid-template-columns:1fr} .span2{grid-column:auto}
  .sticky{position:static} .logo span{display:none}
}
@media (max-width:620px){
  .hwrap{padding:0 16px;gap:10px} main{padding:18px 16px 50px}
  .g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .subjrow{grid-template-columns:1fr 1fr 1fr;} .subjrow .fn{grid-column:1/-1}
  .tablewrap{max-height:none} .pb{grid-template-columns:90px 1fr 40px} .wif{grid-template-columns:110px 1fr 46px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">🎓 Talaba monitoringi <span>· ML tahlil</span></div>
  <nav id="nav">
    <a href="#/">Bosh panel</a><a href="#/tuzilma">Tuzilma</a><a href="#/talabalar">Talabalar</a><a href="#/qoshish">+ Yangi talaba</a>
    <a href="#/analitika">Analitika</a><a href="#/klasterlar">Klasterlar</a><a href="#/modellar">Modellar va aniqlik</a><a href="#/boshqaruv">Boshqaruv</a>
  </nav>
  <button class="iconbtn" id="themeBtn" title="Mavzu">🌓</button>
</div><div id="banner"></div></header>
<main id="app"><div class="loading">Yuklanmoqda…</div></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>

<script>window.DEMO_MODE=true</script>
<script>
/* ======================================================= yordamchilar */
const $=s=>document.querySelector(s), app=$("#app");
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>v==null?"—":Math.round(v*100)+"%";
const f1=v=>v==null?"—":(+v).toFixed(1);
let charts=[], META=null, STATUS={};
const DEMO=window.DEMO_MODE===true, REPO_URL="https://github.com/gosanjar/talaba-ozlashtirish-ml";
async function api(u,o={}){
  if(DEMO) return demoApi(u,o);
  if(o.body&&typeof o.body!=="string"){o.body=JSON.stringify(o.body);o.headers={"Content-Type":"application/json"}}
  const r=await fetch(u,o); const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(typeof j.detail==="string"?j.detail:"Xatolik ("+r.status+")");
  return j;
}
/* ---------- statik demo (GitHub Pages): oldindan hisoblangan JSON fayllar ---------- */
const DEMO_MSG="Bu statik demo (GitHub Pages): qo'shish, tahrirlash, \"agar…\" simulyatori va qayta o'qitish faqat serverli versiyada ishlaydi. README'dagi yo'riqnoma bo'yicha lokal ishga tushiring.";
const DCACHE={};
async function dget(f){if(DCACHE[f])return DCACHE[f]; const r=await fetch("api/"+f); if(!r.ok) throw new Error("Demo'da bu kesim uchun ma'lumot yo'q ("+f+")"); return DCACHE[f]=await r.json();}
function unitKey(p){if(+p.guruh_id) return "g"+p.guruh_id; if(+p.yonalish_id) return "y"+p.yonalish_id+"_k"+(+p.kurs||0); if(+p.fakultet_id) return "f"+p.fakultet_id+"_k"+(+p.kurs||0); return "all_k"+(+p.kurs||0);}
async function demoApi(u,o){
  if(o.method&&o.method!=="GET") throw new Error(DEMO_MSG);
  const [path,q]=u.split("?"), p=Object.fromEntries(new URLSearchParams(q||""));
  let m;
  if(path==="/api/meta") return dget("meta.json");
  if(path==="/api/status") return dget("status.json");
  if(path==="/api/tahlil") return dget("tahlil/"+unitKey(p)+".json");
  if(path==="/api/analitika") return dget("analitika/"+unitKey(p)+".json");
  if(path==="/api/klasterlar") return dget("klasterlar.json");
  if(path==="/api/models") return dget("models.json");
  if(m=path.match(/^\/api\/students\/(\d+)$/)) return dget("talaba/"+m[1]+".json");
  if(m=path.match(/^\/api\/guruhlar\/(\d+)\/fanlar$/)) return dget("guruhlar/"+m[1]+".json");
  if(path==="/api/students"){
    let d=await dget("talabalar.json");
    if(+p.fakultet_id) d=d.filter(r=>r.fakultet_id==p.fakultet_id); if(+p.yonalish_id) d=d.filter(r=>r.yonalish_id==p.yonalish_id);
    if(+p.guruh_id) d=d.filter(r=>r.guruh_id==p.guruh_id); if(+p.kurs) d=d.filter(r=>r.kurs==p.kurs);
    if(p.q){const s=p.q.toLowerCase(); d=d.filter(r=>r.fio.toLowerCase().includes(s)||String(r.id)===p.q)}
    if(p.toifa) d=d.filter(r=>r.toifa===p.toifa); if(p.klaster) d=d.filter(r=>r.cluster_name===p.klaster);
    if(p.xavf) d=d.filter(r=>r.xavf===p.xavf); if(p.tolov) d=d.filter(r=>r.tolov===p.tolov);
    const MX={anomal:r=>r.anomaly,grant_dav:r=>r.tolov==="Kontrakt"&&r.alo_proba>=.5,grant_xavf:r=>r.tolov==="Grant"&&r.pasayish_proba>=.3,chetlash:r=>r.chet_proba>=.5,nb:r=>r.nb>=36,nomalum:r=>r.natija_manba==="bashorat"};
    if(MX[p.maxsus]) d=d.filter(MX[p.maxsus]);
    const col={fio:"fio",guruh:"guruh",natija:"natija",ball:"ball",fail:"fail_proba",chet:"chet_proba",nb:"nb",oraliq:"oraliq",alo:"alo_proba"}[p.sort]||"fio", dir=+p.desc?-1:1;
    d=[...d].sort((a,b)=>{const x=a[col],y=b[col]; if(x==null)return 1; if(y==null)return -1; return (typeof x==="string"?x.localeCompare(y):x-y)*dir});
    const size=Math.max(10,Math.min(+p.size||50,500)), page=Math.max(1,+p.page||1);
    return {total:d.length,page,size,items:d.slice((page-1)*size,page*size)};
  }
  throw new Error(DEMO_MSG);
}
const csvHref=p=>DEMO?REPO_URL+"/tree/main/dataset":"/api/export.csv"+qs(unitParams(p));
function toast(t){const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",3200);}
function mk(el,cfg){const c=new Chart(document.getElementById(el),cfg); charts.push(c); return c;}
function clearCharts(){charts.forEach(c=>c.destroy()); charts=[];}
function axes(extra={}){const g=css("--border"),t=css("--muted"); return {x:{grid:{color:g},ticks:{color:t}},y:{grid:{color:g},ticks:{color:t}},...extra};}
const qs=o=>{const p=Object.entries(o).filter(([k,v])=>v!==""&&v!=null&&v!==0&&v!=="0"); return p.length?"?"+p.map(([k,v])=>k+"="+encodeURIComponent(v)).join("&"):""};
function parseHash(){const h=location.hash.slice(1)||"/"; const [p,q]=h.split("?"); const params={}; new URLSearchParams(q||"").forEach((v,k)=>params[k]=v); return [p,params];}
const L=k=>META.labels[k]||k;

/* ---------- ranglar: toifalar dinamik (baholash tizimiga qarab) ---------- */
const LADDER={2:["--bad","--good"],3:["--bad","--warn","--good"],4:["--bad","--warn","--info","--good"],5:["--bad","--warn","--purple","--info","--good"],6:["--bad","--warn","--gray","--purple","--info","--good"],7:["--bad","--warn","--gray","--purple","--info","--good","--good"]};
const ladder=n=>LADDER[Math.min(7,Math.max(2,n))];
function catVar(name){const c=META.kategoriyalar, i=c.indexOf(name); return i<0?"--gray":ladder(c.length)[i];}
const catPill=n=>`<span class="pill" style="background:var(${catVar(n)}-soft);color:var(${catVar(n)})">${esc(n)}</span>`;
function gradeChip(baho,tid){
  const t=META.tizimlar.find(x=>x.id===tid)||META.tizimlar[0]; const ch=t.chegaralar; const i=ch.findIndex(c=>c.baho===baho);
  if(i<0) return `<span class="gchip" style="background:var(--surface-2)">${esc(baho??"—")}</span>`;
  const v=ladder(ch.length)[ch.length-1-i]; return `<span class="gchip" title="${esc(ch[i].nomi)}" style="background:var(${v}-soft);color:var(${v})">${esc(baho)}</span>`;
}
const CL_VAR={"A'lochi va faol":"--good","Yaxshi, barqaror":"--info","Qobiliyatli, lekin intizomi past":"--purple","Faol, lekin bahosi past":"--warn","O'rtacha, sust":"--gray","Xavf guruhi":"--bad"};
const clVar=n=>CL_VAR[String(n).replace(/ \(2\)$/,"")]||"--gray";
const clPill=n=>`<span class="pill" style="background:var(${clVar(n)}-soft);color:var(${clVar(n)})">${esc(n)}</span>`;
const CL_DESC={"A'lochi va faol":"Yuqori natija, davomat va faollik yaxshi","Yaxshi, barqaror":"Natija ham, faollik ham o'rtachadan yuqori",
 "Qobiliyatli, lekin intizomi past":"Baholar yaxshi, lekin faollik/davomat bahodan past","Faol, lekin bahosi past":"Harakat qiladi, topshiriq va LMS faol, ammo natija faollikka yarasha emas",
 "O'rtacha, sust":"Natija va faollik o'rtachadan past","Xavf guruhi":"Past natija, ko'p NB, past faollik — birinchi navbatda e'tibor"};
const XAVF={"yuqori":["--bad","Yuqori"],"o'rta":["--warn","O'rta"],"past":["--info","Past"],"yo'q":["--good","Yo'q"]};
const riskPill=x=>{const [v,t]=XAVF[x]||XAVF["yo'q"]; return `<span class="pill" style="background:var(${v}-soft);color:var(${v})">${t}</span>`};
function probBar(p,inv){const v=p>=.5?"--bad":p>=.25?"--warn":"--good"; const vv=inv?(p>=.5?"--good":p>=.25?"--info":"--gray"):v;
  return `<div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar" style="width:60px"><i style="width:${Math.round(p*100)}%;background:var(${vv})"></i></div><span class="small">${pct(p)}</span></div>`;}
function toifaStack(t){const cats=META.kategoriyalar, n=cats.reduce((s,c)=>s+(t[c]||0),0)||1;
  return `<div class="stack" title="${cats.map(c=>c+": "+(t[c]||0)).join(", ")}">${cats.map(c=>`<i style="width:${(t[c]||0)/n*100}%;background:var(${catVar(c)})"></i>`).join("")}</div>`;}
const natija=r=>`${f1(r.natija)}${r.natija_manba==="bashorat"?' <span class="muted small" title="Yakuniy hali ma\'lum emas: model bashorati">≈</span>':""}`;

/* ---------- tuzilma yordamchilari ---------- */
const FAK=id=>META.tuzilma.find(f=>f.id==id);
function YON(id){for(const f of META.tuzilma)for(const y of f.yonalishlar)if(y.id==id)return Object.assign({fak:f},y);}
function GUR(id){for(const f of META.tuzilma)for(const y of f.yonalishlar)for(const g of y.guruhlar)if(g.id==id)return Object.assign({yon:y,fak:f},g);}
function unitSelects(p,ids){
  const fak=META.tuzilma, yons=p.fakultet_id?(FAK(p.fakultet_id)?.yonalishlar||[]):fak.flatMap(f=>f.yonalishlar);
  let grs=p.yonalish_id?(YON(p.yonalish_id)?.guruhlar||[]):p.fakultet_id?yons.flatMap(y=>y.guruhlar):[];
  if(p.kurs) grs=grs.filter(g=>g.kurs==p.kurs);
  return `<select id="${ids}f"><option value="">Barcha fakultetlar</option>${fak.map(f=>`<option value="${f.id}" ${f.id==p.fakultet_id?"selected":""}>${esc(f.nomi)}</option>`).join("")}</select>
  <select id="${ids}y"><option value="">Barcha yo'nalishlar</option>${yons.map(y=>`<option value="${y.id}" ${y.id==p.yonalish_id?"selected":""}>${esc(y.kod)} — ${esc(y.nomi)}</option>`).join("")}</select>
  <select id="${ids}k"><option value="">Barcha bosqichlar</option>${[1,2,3,4,5,6].map(k=>`<option value="${k}" ${k==p.kurs?"selected":""}>${k}-kurs</option>`).join("")}</select>
  <select id="${ids}g" ${grs.length?"":"disabled"}><option value="">Barcha guruhlar</option>${grs.map(g=>`<option value="${g.id}" ${g.id==p.guruh_id?"selected":""}>${esc(g.nomi)}</option>`).join("")}</select>`;
}
function bindUnitSelects(ids,p,go){
  $("#"+ids+"f").onchange=e=>go({...p,fakultet_id:e.target.value,yonalish_id:"",guruh_id:"",page:1});
  $("#"+ids+"y").onchange=e=>{const y=YON(e.target.value); go({...p,yonalish_id:e.target.value,fakultet_id:y?y.fak.id:p.fakultet_id,guruh_id:"",page:1})};
  $("#"+ids+"k").onchange=e=>go({...p,kurs:e.target.value,guruh_id:"",page:1});
  $("#"+ids+"g").onchange=e=>go({...p,guruh_id:e.target.value,page:1});
}
const unitParams=p=>({fakultet_id:p.fakultet_id||"",yonalish_id:p.yonalish_id||"",guruh_id:p.guruh_id||"",kurs:p.kurs||""});

function studentRows(items,cols=["fio","guruh","tolov","natija","ball","toifa","fail","chet","cluster","xavf"]){
  const C={fio:r=>`<td><b>${esc(r.fio)}</b>${r.anomaly?' <span title="G\'ayrioddiy ko\'rsatkichlar">⚠️</span>':""}</td>`,guruh:r=>`<td>${esc(r.guruh)} <span class="muted small">${r.kurs}-k</span></td>`,
    tolov:r=>`<td>${esc(r.tolov)}</td>`,natija:r=>`<td class="num">${natija(r)}</td>`,ball:r=>`<td class="num">${f1(r.ball)}</td>`,
    toifa:r=>`<td>${catPill(r.toifa)}</td>`,fail:r=>`<td>${probBar(r.fail_proba)}</td>`,chet:r=>`<td>${probBar(r.chet_proba)}</td>`,
    alo:r=>`<td>${probBar(r.alo_proba,1)}</td>`,pas:r=>`<td>${probBar(r.pasayish_proba)}</td>`,nb:r=>`<td class="num">${r.nb}</td>`,
    cluster:r=>`<td>${clPill(r.cluster_name)}</td>`,xavf:r=>`<td>${riskPill(r.xavf)}</td>`,qarz:r=>`<td class="num">${f1(r.qarz_kutilgan)}</td>`};
  return items.map(r=>`<tr class="click" onclick="location.hash='#/talaba/${r.id}'">${cols.map(c=>C[c](r)).join("")}</tr>`).join("");
}
const HEAD={fio:"F.I.O.",guruh:"Guruh",tolov:"To'lov",natija:"Natija",ball:"Bashorat",toifa:"Toifa (model)",fail:"Qarz ehtimoli",chet:"Chetlash xavfi",
  alo:"A'lo ehtimoli",pas:"71 dan tushish",nb:"NB",cluster:"Klaster",xavf:"Xavf",qarz:"Kutilgan qarz"};
const thead=cols=>`<thead><tr>${cols.map(c=>`<th class="${["natija","ball","nb","qarz"].includes(c)?"num":""}">${HEAD[c]}</th>`).join("")}</tr></thead>`;

function scatterChart(el,points){
  const names=META.klaster_map, ds=Object.entries(names).map(([k,n])=>({label:n,data:points.filter(p=>p.c==k).map(p=>({x:p.x,y:p.y,id:p.id,fio:p.fio,b:p.b})),
    backgroundColor:css(clVar(n))+"bb",pointRadius:3.2,pointHoverRadius:6}));
  mk(el,{type:"scatter",data:{datasets:ds},options:{maintainAspectRatio:false,scales:axes(),
    plugins:{legend:{position:"bottom",labels:{boxWidth:10,color:css("--muted")}},tooltip:{callbacks:{label:c=>`${c.raw.fio}: ${c.raw.b}`}}},
    onClick:(e,a)=>{if(a.length){const p=a[0]; location.hash="#/talaba/"+ds[p.datasetIndex].data[p.index].id}}}});
}

/* ======================================================= holat (fon o'qitish) */
let wasBusy=false;
async function pollStatus(){
  try{STATUS=await api("/api/status")}catch(e){setTimeout(pollStatus,5000);return}
  const b=$("#banner");
  if(STATUS.busy){b.style.display="block"; b.textContent="⏳ "+(STATUS.message||"Model o'qitilmoqda…")+(STATUS.elapsed?` (${Math.round(STATUS.elapsed)} s)`:"")+" — natijalar tayyor bo'lgach yangilanadi"; wasBusy=true}
  else{b.style.display=STATUS.error?"block":"none"; if(STATUS.error) b.textContent="Xatolik: "+STATUS.error;
    if(wasBusy){wasBusy=false; toast("Model yangilandi ✓"); await loadMeta(); route()}}
  setTimeout(pollStatus,STATUS.busy?2000:6000);
}
async function loadMeta(){META=await api("/api/meta")}

/* ======================================================= router */
const ROUTES=[[/^\/$/,()=>pageTahlil({},true)],[/^\/tuzilma$/,p=>pageTahlil(p,false)],[/^\/talabalar$/,pageList],[/^\/talaba\/(\d+)$/,(p,m)=>pageProfile(+m[1])],
  [/^\/qoshish$/,()=>pageForm(null)],[/^\/tahrir\/(\d+)$/,(p,m)=>pageForm(+m[1])],[/^\/analitika$/,pageAnalitika],[/^\/klasterlar$/,pageKlaster],
  [/^\/modellar$/,pageModels],[/^\/boshqaruv$/,pageAdmin]];
async function route(){
  const [path,params]=parseHash(); clearCharts();
  document.querySelectorAll("nav a").forEach(a=>{const h=a.getAttribute("href").slice(1); a.classList.toggle("active",h==="/"?path==="/":path.startsWith(h)||(h==="/talabalar"&&path.startsWith("/talaba/")))});
  for(const [re,fn] of ROUTES){const m=path.match(re); if(m){
    app.innerHTML='<div class="loading">Yuklanmoqda…</div>';
    try{await fn(params,m)}catch(e){app.innerHTML=`<div class="card"><h2>Ma'lumot yuklanmadi</h2><p class="muted">${esc(e.message)}</p><button class="btn ghost" onclick="route()">Qayta urinish</button></div>`}
    window.scrollTo(0,0); return}}
  location.hash="#/";
}

/* ======================================================= 1. Bosh panel / Tuzilma */

  let crumbs=`<a href="#/tuzilma">Universitet</a>`;

  if(p.yonalish_id){const y=YON(p.yonalish_id); crumbs+=` › <a href="#/tuzilma${qs({fakultet_id:y?.fak.id,yonalish_id:y?.id})}">${esc(y?.kod)} ${esc(y?.nomi)}</a>`}
  if(p.guruh_id){const g=GUR(p.guruh_id); crumbs+=` › <b>${esc(g?.nomi)}</b> <span class="muted">(${g?.kurs}-kurs)</span>`}
  if(p.kurs) crumbs+=` <span class="pill" style="background:var(--accent-soft);color:var(--accent)">${p.kurs}-kurs</span>`;
  const LV={fakultet:"Fakultetlar",yonalish:"Yo'nalishlar",guruh:"Guruhlar"};
  app.innerHTML=`

    :`<h1>Tuzilma bo'yicha tahlil</h1><div class="crumbs">${crumbs}</div>`}</div>
    <div class="row"><a class="btn ghost" href="${csvHref(p)}">⬇ CSV</a>${!home?`<a class="btn ghost" href="#/talabalar${qs(unitParams(p))}">Talabalar ro'yxati →</a>`:""}</div></div>
  ${!home?`<div class="filters">${unitSelects(p,"u")}</div>`:""}
  <div class="grid g6">
    ${kpi("Talabalar",s.n,`haqiqiy natija: ${s.haqiqiy_ulush}%`)}${kpi("O'rtacha natija",f1(s.ortacha),`oraliq o'rtacha: ${f1(s.oraliq)}`)}
    ${kpi("Qarz ehtimoli ≥50%",s.otmaydi+"%","kamida 1 fandan qarz",s.otmaydi>25?"--bad":"")}${kpi("Chetlashtirish xavfi",s.chetlash+"%","3+ fandan qarz",s.chetlash>12?"--bad":"")}
    ${kpi("A'loga da'vogar",s.alo_dav,"ehtimol ≥ 50%","--good")}${kpi("Grant / qarzdor",s.grant+"% / "+s.qarzdor+"%",`anomal: ${s.anomal}`)}
  </div>
  ${d.level!=="talaba"?`<div class="card" style="margin-bottom:16px"><div class="between"><h2>${LV[d.level]} kesimida</h2><span class="muted small">qatorni bosing — ichkariga kiring</span></div>
    <div class="tablewrap"><table><thead><tr><th>${LV[d.level].slice(0,-3)}</th>${d.level==="guruh"?"<th>Kurs</th>":""}<th class="num">Talaba</th><th class="num">O'rtacha</th><th class="num">Oraliq</th><th class="num">NB</th><th class="num">Qarz %</th><th class="num">Chetlash %</th><th class="num">Grant %</th><th>Toifalar taqsimoti</th></tr></thead>
    <tbody>${d.children.map(c=>`<tr class="click" data-id="${c.id}"><td><b>${esc(c.kod?c.kod+" — ":"")}${esc(c.nomi)}</b></td>${d.level==="guruh"?`<td>${c.kurs}</td>`:""}<td class="num">${c.n}</td><td class="num"><b>${f1(c.ortacha)}</b></td><td class="num">${f1(c.oraliq)}</td><td class="num">${f1(c.nb)}</td>
    <td class="num" style="color:${c.otmaydi>30?"var(--bad)":"inherit"}">${f1(c.otmaydi)}</td><td class="num">${f1(c.chetlash)}</td><td class="num">${f1(c.grant)}</td><td>${toifaStack(c.toifa)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  <div class="grid g3">
    <div class="card"><h2>Toifalar (${esc(META.tizimlar.find(t=>t.id===META.faol_tizim)?.nomi)})</h2><div class="chart"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>Natijalar taqsimoti (ball)</h2><div class="chart"><canvas id="c2"></canvas></div></div>
    <div class="card"><h2>Bosqichlar bo'yicha</h2><div class="chart"><canvas id="c3"></canvas></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Klasterlar xaritasi (PCA)</h2><p class="muted small" style="margin-top:-8px">Har nuqta — talaba. Bosing — profil ochiladi.</p><div class="chart tall"><canvas id="c4"></canvas></div></div>
    <div class="card"><h2>Fanlar bo'yicha natija</h2><p class="muted small" style="margin-top:-8px">Eng qiyin fanlar yuqorida. Qarz % — haqiqiy, bashorat — fan modeli.</p>
      <div class="tablewrap" style="max-height:340px"><table><thead><tr><th>Fan</th><th class="num">n</th><th class="num">Oraliq</th><th class="num">Natija</th><th class="num">Qarz %</th><th class="num">Bashorat %</th><th>Baholar</th></tr></thead>
      <tbody>${d.fanlar.map(f=>`<tr><td class="wrap">${esc(f.fan)}</td><td class="num">${f.n}</td><td class="num">${f1(f.oraliq)}</td><td class="num"><b>${f1(f.natija)}</b></td><td class="num">${f1(f.qarz_foiz)}</td><td class="num">${f1(f.qarz_bashorat)}</td><td>${toifaStack(f.dist)}</td></tr>`).join("")}</tbody></table></div></div>

    <div class="card"><h2>Klasterlar ulushi</h2><div class="chart"><canvas id="c7"></canvas></div></div>
  </div>
  ${d.students.length?`<div class="card" style="margin-bottom:16px"><h2>Guruh talabalari (${d.students.length})</h2><div class="tablewrap"><table>${thead(["fio","tolov","natija","ball","toifa","fail","chet","cluster","xavf"])}<tbody>${studentRows(d.students,["fio","tolov","natija","ball","toifa","fail","chet","cluster","xavf"])}</tbody></table></div></div>`:""}
  <div class="grid g2">
    <div class="card"><div class="between"><h2>🚨 Eng yuqori xavf</h2><a href="#/talabalar${qs({...unitParams(p),sort:"chet",desc:1})}" class="small">hammasi →</a></div><div class="tablewrap"><table>${thead(["fio","guruh","natija","fail","chet"])}<tbody>${studentRows(d.risk,["fio","guruh","natija","fail","chet"])}</tbody></table></div></div>
    <div class="card"><div class="between"><h2>🏆 Eng yaxshi natijalar</h2><a href="#/talabalar${qs({...unitParams(p),sort:"natija",desc:1})}" class="small">hammasi →</a></div><div class="tablewrap"><table>${thead(["fio","guruh","tolov","natija","alo"])}<tbody>${studentRows(d.top,["fio","guruh","tolov","natija","alo"])}</tbody></table></div></div>
  </div>`;
  if(!home) bindUnitSelects("u",p,go);
  document.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;
    go(d.level==="fakultet"?{fakultet_id:id}:d.level==="yonalish"?{...p,yonalish_id:id,fakultet_id:YON(id)?.fak.id}:{...p,guruh_id:id})});
  mk("c1",{type:"doughnut",data:{labels:cats,datasets:[{data:cats.map(c=>s.toifa[c]||0),backgroundColor:cats.map(c=>css(catVar(c))),borderColor:css("--surface")}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:css("--muted"),boxWidth:10}}}}});
  const pm=META.tizimlar.find(t=>t.id===META.faol_tizim);
  mk("c2",{type:"bar",data:{labels:d.ball_hist.labels,datasets:[{data:d.ball_hist.values,backgroundColor:d.ball_hist.labels.map(l=>css(catVar(META.kategoriyalar[catIdx(+l,pm)]))),borderRadius:3}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:axes()}});
  mk("c3",{type:"bar",data:{labels:d.by_kurs.map(k=>k.kurs+"-kurs"),datasets:[{type:"line",label:"O'rtacha ball",data:d.by_kurs.map(k=>k.ortacha),borderColor:css("--accent"),yAxisID:"y1",tension:.3},
    {label:"Qarz %",data:d.by_kurs.map(k=>k.otmaydi),backgroundColor:css("--bad")+"99",borderRadius:4},{label:"Chetlash %",data:d.by_kurs.map(k=>k.chetlash),backgroundColor:css("--warn")+"99",borderRadius:4}]},

    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:css("--muted"),boxWidth:10}},tooltip:{callbacks:{label:c=>c.dataset.label+": "+c.raw.toFixed(1)+"%"}}},scales:axes()}});

function catIdx(b,t){const ch=[...t.chegaralar].reverse(); let i=0; ch.forEach((c,j)=>{if(b>=c.min)i=j}); return i;}
const kpi=(l,v,s,col)=>`<div class="card kpi"><div class="l">${l}</div><div class="v" style="${col?`color:var(${col})`:""}">${v}</div><div class="s">${s||""}</div></div>`;

/* ======================================================= 2. Talabalar ro'yxati */
async function pageList(p){
  p={sort:"fio",desc:0,page:1,size:50,...p};
  const d=await api("/api/students"+qs(p)); const go=np=>location.hash="#/talabalar"+qs(np);
  const sel=(id,label,opts,val)=>`<select id="${id}"><option value="">${label}</option>${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${v==val?"selected":""}>${esc(t)}</option>`}).join("")}</select>`;
  const pages=Math.max(1,Math.ceil(d.total/d.size));
  const SORTS={fio:"fio",guruh:"guruh",natija:"natija",ball:"ball",fail:"fail",chet:"chet",nb:"nb",alo:"alo"};
  const cols=["fio","guruh","tolov","natija","ball","toifa","fail","chet","alo","nb","cluster","xavf"];
  app.innerHTML=`<div class="between"><div><h1>Talabalar</h1><p class="sub">${d.total} ta talaba topildi. Ustun nomini bosib saralang.</p></div>
    <div class="row"><a class="btn ghost" href="${csvHref(p)}">⬇ CSV</a><a class="btn" href="#/qoshish">+ Yangi talaba</a></div></div>
  <div class="filters">${unitSelects(p,"l")}</div>
  <div class="filters"><input id="q" placeholder="Ism yoki ID bo'yicha qidirish…" value="${esc(p.q||"")}">
    ${sel("ft","Barcha toifalar",META.kategoriyalar,p.toifa)}${sel("fc","Barcha klasterlar",META.klasterlar,p.klaster)}
    ${sel("fx","Xavf: barchasi",[["yuqori","Xavf: yuqori"],["o'rta","Xavf: o'rta"],["past","Xavf: past"],["yo'q","Xavf: yo'q"]],p.xavf)}
    ${sel("fp","To'lov: barchasi",["Grant","Kontrakt"],p.tolov)}
    ${sel("fm","Maxsus ro'yxat…",[["chetlash","Chetlashtirish xavfi"],["grant_dav","Grantga da'vogar (kontrakt)"],["grant_xavf","Grantni yo'qotish xavfi"],["nb","NB limitiga yetganlar (36+)"],["anomal","G'ayrioddiy (anomaliya)"],["nomalum","Yakuniysi hali noma'lum"]],p.maxsus)}</div>
  <div class="card"><div class="tablewrap"><table><thead><tr>${cols.map(c=>{const s=SORTS[c]; return `<th class="${s?"sort":""} ${["natija","ball","nb"].includes(c)?"num":""}" ${s?`data-s="${s}"`:""}>${HEAD[c]}${p.sort===s?(+p.desc?" ↓":" ↑"):""}</th>`}).join("")}</tr></thead>
  <tbody>${studentRows(d.items,cols)}</tbody></table></div>
  <div class="pager"><span class="muted small">${(d.page-1)*d.size+1}–${Math.min(d.total,d.page*d.size)} / ${d.total}</span>
   <button class="btn ghost sm" id="pv" ${d.page<=1?"disabled":""}>‹</button><span class="small">${d.page} / ${pages}</span><button class="btn ghost sm" id="nx" ${d.page>=pages?"disabled":""}>›</button></div></div>`;
  bindUnitSelects("l",p,go);
  let t; $("#q").oninput=e=>{clearTimeout(t); t=setTimeout(()=>go({...p,q:e.target.value,page:1}),400)};
  [["ft","toifa"],["fc","klaster"],["fx","xavf"],["fp","tolov"],["fm","maxsus"]].forEach(([id,k])=>$("#"+id).onchange=e=>go({...p,[k]:e.target.value,page:1}));
  document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{const s=th.dataset.s; go({...p,sort:s,desc:p.sort===s?(+p.desc?0:1):(["natija","ball","fail","chet","nb","alo"].includes(s)?1:0),page:1})});
  $("#pv").onclick=()=>go({...p,page:+p.page-1}); $("#nx").onclick=()=>go({...p,page:+p.page+1});
  if(p.q){const q=$("#q"); q.focus(); q.setSelectionRange(q.value.length,q.value.length)}
}

/* ======================================================= 3. Talaba profili */
function predCards(pr,haq){
  const cats=META.kategoriyalar;
  return `<div class="grid g4">
  <div class="card pred-card"><div class="muted small">Regressiya: kutilayotgan yakuniy ball</div><div class="v">${f1(pr.ball)}</div>

function shapBlock(ex,base){
  const mx=Math.max(...ex.map(e=>Math.abs(e.impact)),1);
  return `<h2>Bashorat sabablari (SHAP)</h2><p class="muted small" style="margin-top:-8px">O'rtacha talaba (${f1(base)} ball) bilan solishtirganda har bir omil ballni qancha o'zgartirgani.</p>
  ${ex.map(e=>`<div class="factor"><span>${esc(e.label)} <span class="muted">= ${esc(e.value)}</span></span>
   <div class="dv"><div class="h l">${e.impact<0?`<i style="width:${Math.abs(e.impact)/mx*100}%;background:var(--bad)"></i>`:""}</div><div class="h">${e.impact>0?`<i style="width:${e.impact/mx*100}%;background:var(--good)"></i>`:""}</div></div>
   <b class="small" style="text-align:right;color:var(${e.impact>0?"--good":"--bad"})">${e.impact>0?"+":""}${e.impact.toFixed(1)}</b></div>`).join("")}`;
}
const ADV_VAR={danger:"--bad",warn:"--warn",info:"--info",good:"--good"};
const advBlock=a=>`<div class="adv">${a.map(x=>`<div style="background:var(${ADV_VAR[x.tur]}-soft);border-color:var(${ADV_VAR[x.tur]})">${esc(x.matn)}</div>`).join("")}</div>`;
const simBlock=s=>s.map(x=>`<div class="sim" onclick="location.hash='#/talaba/${x.id}'"><span>${esc(x.fio)} <span class="muted small">${esc(x.guruh)}</span></span><span>${natija(x)} ${clPill(x.cluster_name)}</span></div>`).join("")||'<p class="muted">—</p>';

function whatIf(t,baholar,pr){
  if(DEMO){$("#wif").innerHTML=`<div class="note">${esc(DEMO_MSG)}</div>`; return}
  const S=[["nb_sababsiz",0,90,1],["topshiriq",0,100,1],["lms_kirish",0,100,1],["mustaqil_soat",0,30,.5],["ish_soati",0,50,1],["oraliq_shift",-20,20,1]];
  const st={...t,oraliq_shift:0};
  $("#wif").innerHTML=S.map(([k,a,b,s])=>`<div class="wif"><span>${k==="oraliq_shift"?"Barcha fanlardan oraliq ±":esc(L(k))}</span><input type="range" min="${a}" max="${b}" step="${s}" value="${st[k]}" data-k="${k}"><b id="v_${k}">${st[k]}</b></div>`).join("")+
    `<div class="row" style="margin-top:6px"><label class="small" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="wq" style="width:auto" ${t.kontrakt_qarz==="Ha"?"checked":""}> Kontrakt qarzi bor</label><label class="small" style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="wi" style="width:auto" ${t.ishlaydi==="Ha"?"checked":""}> Ishlaydi</label><button class="btn ghost sm" id="wr">Asl holatga qaytarish</button></div>`;
  let tm;
  const run=async()=>{
    const body={...t,kontrakt_qarz:$("#wq").checked?"Ha":"Yo'q",ishlaydi:$("#wi").checked?"Ha":"Yo'q",baholar:baholar.map(g=>({fan_id:g.fan_id,joriy:g.joriy,oraliq:Math.max(0,Math.min(100,g.oraliq+st.oraliq_shift)),yakuniy:null}))};
    S.forEach(([k])=>{if(k!=="oraliq_shift")body[k]=+st[k]}); delete body.id; delete body.created_at;
    try{const r=await api("/api/preview",{method:"POST",body}); const p=r.prediction, dl=p.ball-pr.ball;
      const D=(a,b,inv)=>{const x=a-b; if(Math.abs(x)<0.005)return '<span class="muted">0</span>'; const up=inv?x<0:x>0; return `<span class="${up?"delta-up":"delta-dn"}">${x>0?"+":""}${(x*100).toFixed(0)} p.p.</span>`};
      $("#wifRes").innerHTML=`<div class="grid g3" style="margin:0"><div class="note">Ball: <b>${f1(p.ball)}</b> <span class="${dl>=0?"delta-up":"delta-dn"}">${dl>=0?"+":""}${dl.toFixed(1)}</span><br>${catPill(p.toifa)}</div>
       <div class="note">Qarz: <b>${pct(p.fail_proba)}</b> ${D(p.fail_proba,pr.fail_proba,1)}<br>Chetlash: <b>${pct(p.chet_proba)}</b> ${D(p.chet_proba,pr.chet_proba,1)}</div>
       <div class="note">A'lo: <b>${pct(p.alo_proba)}</b> ${D(p.alo_proba,pr.alo_proba)}<br>${clPill(p.cluster_name)}</div></div>`}catch(e){$("#wifRes").innerHTML=`<div class="err">${esc(e.message)}</div>`}
  };
  document.querySelectorAll("#wif input[type=range]").forEach(i=>i.oninput=()=>{st[i.dataset.k]=+i.value; $("#v_"+i.dataset.k).textContent=i.value; clearTimeout(tm); tm=setTimeout(run,250)});
  $("#wq").onchange=$("#wi").onchange=run;
  $("#wr").onclick=()=>whatIf(t,baholar,pr);
  $("#wifRes").innerHTML='<p class="muted small">Slayderni suring…</p>';
}

function adminTuzilma(){
  const ab=$("#ab");
  ab.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn" id="af">+ Fakultet</button><button class="btn ghost" id="ay">+ Yo'nalish</button><button class="btn ghost" id="ag">+ Guruh</button></div>
  ${META.tuzilma.map(f=>`<div class="card" style="margin-bottom:14px"><div class="between"><h2 style="margin:0">${esc(f.nomi)}</h2><div class="row"><button class="btn ghost sm" data-ef="${f.id}">✏️</button><button class="btn danger sm" data-df="${f.id}">🗑</button></div></div>
   ${f.yonalishlar.map(y=>`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)"><div class="between"><div><b>${esc(y.kod)} — ${esc(y.nomi)}</b> <span class="muted small">${y.talabalar} talaba · ${y.guruhlar.length} guruh</span></div>
     <div class="row"><button class="btn ghost sm" data-ng="${y.id}">+ guruh</button><button class="btn ghost sm" data-ey="${y.id}">✏️</button><button class="btn danger sm" data-dy="${y.id}">🗑</button></div></div>
     <div class="chips" style="margin-top:8px">${y.guruhlar.map(g=>`<span class="chip"><a href="#/tuzilma${qs({fakultet_id:f.id,yonalish_id:y.id,guruh_id:g.id})}">${esc(g.nomi)}</a> <span class="muted">${g.kurs}-k · ${g.talabalar}</span>
       <button title="Tahrirlash" style="color:var(--muted)" data-eg="${g.id}">✏️</button><button title="O'chirish" data-dg="${g.id}">×</button></span>`).join("")||'<span class="muted small">Guruh yo\'q</span>'}</div></div>`).join("")||'<p class="muted small">Yo\'nalish yo\'q</p>'}</div>`).join("")}
  <p class="note">Talabasi bor guruhni, guruhi bor yo'nalishni yoki yo'nalishi bor fakultetni o'chirib bo'lmaydi — avval ichidagilarni o'chiring yoki ko'chiring.</p>`;
  $("#af").onclick=()=>formModal("Yangi fakultet",FK,{},save("fakultetlar"));
  $("#ay").onclick=()=>formModal("Yangi yo'nalish",YK(),{},save("yonalishlar"));
  $("#ag").onclick=()=>formModal("Yangi guruh",GK(),{kurs:1},save("guruhlar"));
  ab.querySelectorAll("[data-ef]").forEach(b=>b.onclick=()=>{const f=FAK(b.dataset.ef); formModal("Fakultetni tahrirlash",FK,f,save("fakultetlar",f.id))});
  ab.querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>delItem("/api/admin/fakultetlar/"+b.dataset.df,FAK(b.dataset.df).nomi));
  ab.querySelectorAll("[data-ey]").forEach(b=>b.onclick=()=>{const y=YON(b.dataset.ey); formModal("Yo'nalishni tahrirlash",YK(),y,save("yonalishlar",y.id))});
  ab.querySelectorAll("[data-dy]").forEach(b=>b.onclick=()=>delItem("/api/admin/yonalishlar/"+b.dataset.dy,YON(b.dataset.dy).nomi));
  ab.querySelectorAll("[data-ng]").forEach(b=>b.onclick=()=>formModal("Yangi guruh",GK(),{yonalish_id:+b.dataset.ng,kurs:1},save("guruhlar")));
  ab.querySelectorAll("[data-eg]").forEach(b=>b.onclick=()=>{const g=GUR(b.dataset.eg); formModal("Guruhni tahrirlash",GK(),g,save("guruhlar",g.id))});
  ab.querySelectorAll("[data-dg]").forEach(b=>b.onclick=()=>delItem("/api/admin/guruhlar/"+b.dataset.dg,GUR(b.dataset.dg).nomi));
}
function adminFanlar(){
  const ab=$("#ab");
  ab.innerHTML=`<div class="between" style="margin-bottom:12px"><input id="fq" placeholder="Fan qidirish…" style="max-width:260px"><button class="btn" id="nf">+ Yangi fan</button></div>
  <div class="card"><div class="tablewrap"><table><thead><tr><th>Fan</th><th class="num">Kredit</th><th>Baholash tizimi</th><th class="num">Rejada</th><th class="num">Baholar</th><th></th></tr></thead><tbody id="ftb"></tbody></table></div></div>
  <p class="note">Fanning baholash tizimi yoki krediti o'zgarsa, model qayta o'qitiladi. Bahosi bor fanni o'chirib bo'lmaydi.</p>`;
  const draw=q=>$("#ftb").innerHTML=META.fanlar.filter(f=>!q||f.nomi.toLowerCase().includes(q.toLowerCase())).map(f=>`<tr><td><b>${esc(f.nomi)}</b></td><td class="num">${f.kredit}</td><td>${esc(f.tizim)}</td><td class="num">${f.rejada}</td><td class="num">${f.baholar_soni}</td>
    <td class="num"><button class="btn ghost sm" data-e="${f.id}">✏️</button> <button class="btn danger sm" data-d="${f.id}">🗑</button></td></tr>`).join("");
  draw(""); $("#fq").oninput=e=>{draw(e.target.value); bind()};
  const bind=()=>{ab.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const f=META.fanlar.find(x=>x.id==b.dataset.e); formModal("Fanni tahrirlash",FNK(),f,save("fanlar",f.id))});
    ab.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>delItem("/api/admin/fanlar/"+b.dataset.d,META.fanlar.find(x=>x.id==b.dataset.d).nomi))}; bind();
  $("#nf").onclick=()=>formModal("Yangi fan",FNK(),{kredit:6,tizim_id:META.faol_tizim},save("fanlar"));
}
let REJA_Y=null;
function adminReja(){
  const ab=$("#ab"), ys=META.tuzilma.flatMap(f=>f.yonalishlar); if(!ys.length){ab.innerHTML='<p class="muted">Avval yo\'nalish qo\'shing.</p>';return}
  if(!ys.some(y=>y.id==REJA_Y)) REJA_Y=ys[0].id; const y=YON(REJA_Y);
  ab.innerHTML=`<div class="filters"><select id="ry">${ys.map(x=>`<option value="${x.id}" ${x.id==REJA_Y?"selected":""}>${esc(x.kod)} — ${esc(x.nomi)}</option>`).join("")}</select></div>
  <div class="grid g3">${[1,2,3,4,5,6].map(k=>{const list=y.reja[k]||[]; const free=META.fanlar.filter(f=>!list.some(l=>l.id===f.id)); const ng=y.guruhlar.filter(g=>g.kurs===k).length;
   return `<div class="card"><div class="between"><h2 style="margin:0">${k}-kurs</h2><span class="muted small">${list.length} fan · ${ng} guruh</span></div>
    <div class="chips" style="margin:10px 0">${list.map(f=>`<span class="chip">${esc(f.nomi)}<button title="Rejadan olib tashlash" data-rm="${k}:${f.id}">×</button></span>`).join("")||'<span class="muted small">Fan biriktirilmagan</span>'}</div>
    <div class="row" style="flex-wrap:nowrap"><select data-sel="${k}"><option value="">Fan qo'shish…</option>${free.map(f=>`<option value="${f.id}">${esc(f.nomi)}</option>`).join("")}</select><button class="btn sm" data-add="${k}">+</button></div></div>`}).join("")}</div>
  <p class="note">O'quv reja talaba qo'shish formasida qaysi fanlar chiqishini belgilaydi. Fan darajasidagi model har qanday fanlar to'plami bilan ishlaydi.</p>`;
  $("#ry").onchange=e=>{REJA_Y=+e.target.value; adminReja()};
  ab.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const [k,f]=b.dataset.rm.split(":"); await api(`/api/admin/reja?yonalish_id=${REJA_Y}&kurs=${k}&fan_id=${f}`,{method:"DELETE"}); refreshAdmin("Rejadan olib tashlandi")});
  ab.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{const k=b.dataset.add, f=ab.querySelector(`[data-sel="${k}"]`).value; if(!f)return; await api("/api/admin/reja",{method:"POST",body:{yonalish_id:REJA_Y,kurs:+k,fan_id:+f}}); refreshAdmin("Rejaga qo'shildi")});
}
function adminTizim(){
  const ab=$("#ab");
  ab.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn" id="nt">+ Yangi baholash tizimi</button></div>
  <div class="grid g3">${META.tizimlar.map(t=>{const act=t.id===META.faol_tizim, used=META.fanlar.filter(f=>f.tizim_id===t.id).length; const n=t.chegaralar.length;
   return `<div class="card" style="${act?"border-color:var(--accent);border-width:2px":""}"><div class="between"><h2 style="margin:0">${esc(t.nomi)}</h2>${act?'<span class="pill" style="background:var(--accent-soft);color:var(--accent)">Faol</span>':""}</div>
    <p class="muted small">${esc(t.tavsif||"")} · ${used} fanda ishlatiladi</p>
    <table><thead><tr><th class="num">Min ball</th><th>Baho</th><th>Nomi</th><th>O'tadi</th></tr></thead><tbody>${t.chegaralar.map((c,i)=>`<tr><td class="num">${c.min}</td><td><span class="gchip" style="background:var(${ladder(n)[n-1-i]}-soft);color:var(${ladder(n)[n-1-i]})">${esc(c.baho)}</span></td><td>${esc(c.nomi)}</td><td>${c.otish?"✓":"✗"}</td></tr>`).join("")}</tbody></table>
    <div class="row" style="margin-top:10px">${act?"":`<button class="btn sm" data-act="${t.id}">Faol qilish</button>`}<button class="btn ghost sm" data-e="${t.id}">✏️ Tahrirlash</button>${act?"":`<button class="btn danger sm" data-d="${t.id}">🗑</button>`}</div></div>`}).join("")}</div>
  <p class="note">Faol tizim talabalarning umumiy toifasini (klassifikatsiya sinflari) belgilaydi. Har bir fan o'z tizimi bo'yicha baholanadi va o'tish chegarasi shundan olinadi. Barcha ballar ichki 0–100 shkalada saqlanadi.</p>`;
  $("#nt").onclick=()=>tizimEditor(null);
  ab.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>tizimEditor(META.tizimlar.find(t=>t.id==b.dataset.e)));
  ab.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>delItem("/api/admin/tizimlar/"+b.dataset.d,META.tizimlar.find(t=>t.id==b.dataset.d).nomi));
  ab.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{if(!confirm("Faol tizim o'zgarsa, toifalar o'zgaradi va model to'liq qayta o'qitiladi (~1 daqiqa). Davom etilsinmi?"))return;
    await api("/api/admin/faol_tizim/"+b.dataset.act,{method:"PUT"}); wasBusy=true; refreshAdmin("Faol tizim o'zgardi, model qayta o'qitilmoqda…")});
}
function tizimEditor(t){
  let rows=t?t.chegaralar.map(c=>({...c})):[{min:85,baho:"A",nomi:"A'lo",otish:true},{min:70,baho:"B",nomi:"Yaxshi",otish:true},{min:55,baho:"C",nomi:"Qoniqarli",otish:true},{min:0,baho:"F",nomi:"Qoniqarsiz",otish:false}];
  const draw=()=>{$("#tzr").innerHTML=rows.map((r,i)=>`<div class="tz"><input type="number" min="0" max="100" value="${r.min}" data-i="${i}" data-k="min" title="Min ball"><input value="${esc(r.baho)}" data-i="${i}" data-k="baho" title="Baho belgisi"><input value="${esc(r.nomi)}" data-i="${i}" data-k="nomi" title="Nomi">
    <label style="margin:0;display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:auto" ${r.otish?"checked":""} data-i="${i}" data-k="otish">o'tadi</label><button type="button" class="btn danger sm" data-x="${i}">×</button></div>`).join("");
    $("#tzr").querySelectorAll("input").forEach(inp=>inp.oninput=inp.onchange=()=>{const r=rows[inp.dataset.i]; r[inp.dataset.k]=inp.type==="checkbox"?inp.checked:inp.type==="number"?+inp.value:inp.value});
    $("#tzr").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.x,1); draw()})};
  modal(`<h2>${t?"Baholash tizimini tahrirlash":"Yangi baholash tizimi"}</h2><label>Nomi<input id="tn" value="${esc(t?.nomi||"")}"></label><label>Tavsif<input id="td" value="${esc(t?.tavsif||"")}"></label>
   <div class="tz small muted"><span>Min ball</span><span>Baho</span><span>Nomi</span><span></span><span></span></div><div id="tzr"></div>
   <button type="button" class="btn ghost sm" id="tadd">+ daraja</button><p class="muted small">Ball shu chegaradan yuqori bo'lsa, shu baho qo'yiladi. Eng past daraja 0 dan boshlanadi.</p>
   <div class="row"><button class="btn" id="tsave">Saqlash</button><button class="btn ghost" onclick="closeModal()">Bekor</button></div><div class="err" id="merr"></div>`);
  draw(); $("#tadd").onclick=()=>{rows.push({min:50,baho:"",nomi:"",otish:true}); draw()};
  $("#tsave").onclick=async()=>{try{const r=await api("/api/admin/tizimlar"+(t?"/"+t.id:""),{method:t?"PUT":"POST",body:{nomi:$("#tn").value,tavsif:$("#td").value,chegaralar:rows}});
    closeModal(); if(r.retrain) wasBusy=true; refreshAdmin(r.retrain?"Saqlandi, model qayta o'qitilmoqda…":"Saqlandi ✓")}catch(e){$("#merr").textContent=e.message}};
}

/* ======================================================= ishga tushirish */
$("#themeBtn").onclick=()=>{const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark"; try{localStorage.setItem("theme",r.dataset.theme)}catch(e){} route()};
try{const t=localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener("hashchange",route);
(async function boot(){
  for(;;){try{await loadMeta(); STATUS=META.status; if(META.status.ready) break}catch(e){}
    app.innerHTML=`<div class="loading">⏳ Model birinchi marta o'qitilmoqda (1500+ talaba, ~1 daqiqa)…<br><span class="small">${esc(META?.status?.message||"")}</span></div>`; await new Promise(r=>setTimeout(r,2500))}
  if(typeof Chart!=="undefined"){Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.color=css("--muted")}
  if(DEMO){const b=$("#banner"); b.style.display="block"; b.style.background="var(--info-soft)"; b.style.color="var(--info)"; b.innerHTML=`Statik demo — faqat ko'rish (oldindan hisoblangan bashoratlar). To'liq tizim (qo'shish, tahrirlash, qayta o'qitish): <a href="${REPO_URL}#readme">GitHub yo'riqnomasi</a>`; route(); return}
  route(); pollStatus();
})();
</script>
